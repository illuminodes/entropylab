[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Unlicense"
publish = false

[workspace.dependencies]
secp256k1 = { version = "=0.29.1", default-features = false, features = ["std", "lowmemory"] }
bitcoin_hashes = { version = "=0.14.101", default-features = false, features = ["alloc"] }
bitcoin = { version = "=0.32.11", default-features = false, features = ["std", "secp-lowmemory"] }
bip39 = { version = "=2.2.2", default-features = false }
base58ck = { version = "=0.1.101", default-features = false, features = ["std"] }
bech32 = { version = "=0.11.1", default-features = false, features = ["alloc"] }

el-entropy = { path = "crates/el-entropy" }
xinachtli = { path = "/home/cuarentaydos/Code/tooling/xinachtli" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
undocumented_unsafe_blocks = "warn"
